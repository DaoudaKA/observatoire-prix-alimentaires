name: Rafraîchissement mensuel des données

on:
  schedule:
    - cron: "0 6 20 * *"   # le 20 de chaque mois, 6h UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Pipeline complet (Dagster) - téléchargement HDX, dbt, prévisions, export
        env:
          HDX_DOWNLOAD: "1"
          DAGSTER_HOME: ${{ runner.temp }}/dagster
          DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
        run: |
          mkdir -p "$DAGSTER_HOME"
          (cd transform && dbt parse --profiles-dir .)
          dagster asset materialize -m orchestration.definitions --select '*'
      - name: Publier les nouvelles données (Vercel redéploie automatiquement)
        run: |
          git config user.name "observatoire-bot"
          git config user.email "actions@users.noreply.github.com"
          git add web/data data/raw
          git diff --cached --quiet || git commit -m "data: rafraîchissement $(date -u +%Y-%m)"
          git push
